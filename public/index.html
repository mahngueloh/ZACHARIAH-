<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MAHNGUELOH MD SESSION</title>
<style>
  :root {
    --gold: #FFD700;
    --gold-dim: #b89b1f;
    --bg: #0a0a0a;
    --card: #141414;
    --card-border: #2a2a2a;
    --text: #f2f2f2;
    --text-dim: #8a8a8a;
    --danger: #ff5c5c;
    --ok: #3ddc84;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,215,0,0.06), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,215,0,0.04), transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 36px 28px;
    box-shadow: 0 0 0 1px rgba(255,215,0,0.03), 0 20px 60px rgba(0,0,0,0.5);
  }
  .mark {
    width: 56px; height: 56px;
    border-radius: 14px;
    margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1c1c1c, #0a0a0a);
    border: 1px solid var(--gold-dim);
    font-size: 26px;
  }
  h1 {
    text-align: center;
    font-size: 19px;
    letter-spacing: 0.06em;
    margin: 0 0 4px;
    color: var(--gold);
  }
  .subtitle {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    margin: 0 0 28px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  input[type=text] {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 13px 14px;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type=text]:focus { border-color: var(--gold-dim); }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, var(--gold), #b8860b);
    color: #0a0a0a;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .result {
    margin-top: 22px;
    padding: 16px;
    border-radius: 12px;
    background: #0d0d0d;
    border: 1px solid var(--card-border);
    display: none;
  }
  .result.show { display: block; }
  .result-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .code {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--gold);
    text-align: center;
    word-break: break-all;
  }
  .status-line {
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--text-dim);
    text-align: center;
  }
  .status-line.ok { color: var(--ok); }
  .status-line.err { color: var(--danger); }
  textarea {
    width: 100%;
    margin-top: 10px;
    background: #0d0d0d;
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px;
    font-size: 11px;
    font-family: monospace;
    resize: none;
    height: 90px;
  }
  .copy-btn {
    margin-top: 8px;
    background: transparent;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-size: 12px;
    padding: 9px;
  }
  .steps {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .steps b { color: var(--text); }
  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 10.5px;
    color: #4a4a4a;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">🔗</div>
    <h1 id="siteTitle">MAHNGUELOH MD SESSION</h1>
    <p class="subtitle">Link your WhatsApp account to generate a session ID</p>

    <label for="phone">Phone number (with country code, no + or spaces)</label>
    <input type="text" id="phone" placeholder="2547XXXXXXXX" inputmode="numeric" />

    <button id="pairBtn">Get Pairing Code</button>

    <div class="result" id="result">
      <div class="result-label" id="resultLabel">Pairing Code</div>
      <div class="code" id="resultValue">— — — —</div>
      <div class="steps" id="steps"></div>
      <div class="status-line" id="statusLine"></div>
      <button class="copy-btn" id="newCodeBtn" style="display:none">Request New Code</button>
      <textarea id="sessionBox" style="display:none" readonly></textarea>
      <button class="copy-btn" id="copyBtn" style="display:none">Copy Session ID</button>
    </div>

    <div class="footer">MAHNGUELOH MD — Session Generator</div>
  </div>

<script>
const phoneInput = document.getElementById('phone');
const pairBtn = document.getElementById('pairBtn');
const result = document.getElementById('result');
const resultLabel = document.getElementById('resultLabel');
const resultValue = document.getElementById('resultValue');
const statusLine = document.getElementById('statusLine');
const steps = document.getElementById('steps');
const sessionBox = document.getElementById('sessionBox');
const copyBtn = document.getElementById('copyBtn');
const newCodeBtn = document.getElementById('newCodeBtn');

fetch('/api/site-name').then(r => r.json()).then(d => {
  if (d.name) {
    document.title = d.name;
    document.getElementById('siteTitle').textContent = d.name;
  }
}).catch(() => {});

let poller = null;
let currentJobId = null;

// When the user switches back to this tab (e.g. after entering the code
// in WhatsApp), immediately re-check status instead of waiting for the
// next scheduled tick — makes recovery from a spun-down free instance
// feel instant rather than adding an extra delay on top of the wake-up.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && currentJobId && poller) {
    poll(currentJobId);
  }
});

function setStatus(text, cls) {
  statusLine.textContent = text;
  statusLine.className = 'status-line' + (cls ? ' ' + cls : '');
}

pairBtn.addEventListener('click', () => startPairing());
newCodeBtn.addEventListener('click', () => startPairing());

async function startPairing() {
  const number = phoneInput.value.replace(/[^0-9]/g, '');
  if (!number || number.length < 8) {
    alert('Enter a valid phone number with country code, digits only.');
    return;
  }

  if (poller) clearInterval(poller);

  pairBtn.disabled = true;
  pairBtn.textContent = 'Requesting...';
  newCodeBtn.style.display = 'none';
  result.classList.add('show');
  resultLabel.textContent = 'Pairing Code';
  resultValue.textContent = '— — — —';
  sessionBox.style.display = 'none';
  copyBtn.style.display = 'none';
  steps.innerHTML = '';
  setStatus('Contacting WhatsApp servers...', '');

  try {
    const res = await fetch('/api/pair', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ number }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to start pairing');

    currentJobId = data.jobId;
    poller = setInterval(() => poll(data.jobId), 2000);
  } catch (e) {
    setStatus(e.message, 'err');
    pairBtn.disabled = false;
    pairBtn.textContent = 'Get Pairing Code';
  }
}

let pollFailCount = 0;
const MAX_POLL_FAILS = 30; // tolerate up to ~60s of downtime (Render free-tier wake-up can take 50s+)

async function poll(jobId) {
  try {
    const res = await fetch('/api/status/' + jobId);
    const job = await res.json();
    if (!res.ok) throw new Error(job.error || 'Job expired');

    pollFailCount = 0; // reset on any successful round-trip

    if (job.status === 'code_ready' && job.code) {
      if (resultValue.textContent !== job.code) {
        resultValue.textContent = job.code;
        // Auto-copy the code to clipboard as soon as it's generated.
        const rawCode = job.code.replace(/-/g, '');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(rawCode).catch(() => {});
        }
      }
      steps.innerHTML =
        '<b>Steps:</b><br>' +
        '1. Open WhatsApp → tap ⋮ (3-dot menu)<br>' +
        '2. Linked Devices → Link a Device<br>' +
        '3. Tap "Link with phone number instead"<br>' +
        '4. Paste or enter the code above (already copied)';
      setStatus('Code copied to clipboard — waiting for you to enter it in WhatsApp...', '');
      newCodeBtn.style.display = 'block';
    } else if (job.status === 'linked' && job.sessionId) {
      clearInterval(poller);
      resultLabel.textContent = 'Linked! Your Session ID';
      resultValue.textContent = '✅ Paired successfully';
      steps.innerHTML = 'Copy the session ID below and save it somewhere safe — it will not be shown again.';
      setStatus('Session ready.', 'ok');
      sessionBox.style.display = 'block';
      sessionBox.value = job.sessionId;
      copyBtn.style.display = 'block';
      newCodeBtn.style.display = 'none';
      pairBtn.disabled = false;
      pairBtn.textContent = 'Get Pairing Code';
    } else if (job.status === 'error') {
      clearInterval(poller);
      setStatus(job.error || 'Something went wrong.', 'err');
      newCodeBtn.style.display = 'none';
      pairBtn.disabled = false;
      pairBtn.textContent = 'Get Pairing Code';
    }
  } catch (e) {
    pollFailCount += 1;
    if (pollFailCount >= MAX_POLL_FAILS) {
      clearInterval(poller);
      setStatus('Lost connection to the server (' + e.message + '). Please try again.', 'err');
      newCodeBtn.style.display = 'none';
      pairBtn.disabled = false;
      pairBtn.textContent = 'Get Pairing Code';
    } else {
      // Transient network blip — stay quiet and let the next poll retry.
      setStatus('Reconnecting...', '');
    }
  }
}

copyBtn.addEventListener('click', () => {
  sessionBox.select();
  document.execCommand('copy');
  copyBtn.textContent = 'Copied ✓';
  setTimeout(() => (copyBtn.textContent = 'Copy Session ID'), 1500);
});
</script>
</body>
</html>
